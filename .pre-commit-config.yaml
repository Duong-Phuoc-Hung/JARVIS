repos:
  # ── Code Formatting ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: "Ruff: lint + autofix"
      - id: ruff-format
        name: "Ruff: format"

  # ── Basic File Quality ─────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "Fix end-of-file newlines"
      - id: check-yaml
        name: "Check YAML syntax"
      - id: check-json
        name: "Check JSON syntax"
      - id: check-merge-conflict
        name: "Check for merge conflict markers"
      - id: check-added-large-files
        args: [--maxkb=1000]
        name: "Prevent large files"
      - id: debug-statements
        name: "Check for debug statements (breakpoint/pdb)"

  # ── Python Type Checking ───────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        name: "Mypy: type check"
        files: ^jarvis/
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies:
          - types-requests
          - types-Pillow

  # ── Security Scanning ─────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: "Bandit: security scan"
        args: [-r, jarvis/, -ll, --skip, B101,B311,B603,B607]

  # ── Commit Message Convention ─────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.27.0
    hooks:
      - id: commitizen
        name: "Commitizen: conventional commit check"
        stages: [commit-msg]

ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autoupdate_schedule: weekly
