name: JARVIS Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  JARVIS_SANDBOX_ALLOW_COMPAT_FALLBACK: "1"

jobs:
  # ── Build Windows .exe ─────────────────────────────────────────
  build:
    name: 🏗️ Build Windows Executable
    runs-on: windows-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}
      exe_size: ${{ steps.build.outputs.exe_size }}
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          pip install pyinstaller --quiet

      - name: Install Windows deps
        run: pip install pywin32 pystray keyboard sounddevice --quiet
        continue-on-error: true

      - name: Run tests before build
        run: |
          python -m pytest tests/unit/ -q --timeout=60 --tb=short
          Write-Host "All tests passed — proceeding with build"

      - name: Build JARVIS.exe
        id: build
        run: |
          python scripts/build_installer.py --exe-only --skip-tests
          $exe = Get-Item "dist/JARVIS.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          echo "exe_size=$sizeMB MB" >> $env:GITHUB_OUTPUT
          Write-Host "Built: dist/JARVIS.exe ($sizeMB MB)"

      - name: Create release archive
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $archiveName = "JARVIS_v${ver}_windows_x64.zip"
          Compress-Archive -Path "dist/JARVIS.exe" -DestinationPath $archiveName -Force
          Write-Host "Archive: $archiveName"
          echo "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Upload UNSIGNED artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: "dist/JARVIS.exe"
          retention-days: 7

  # ── Code Signing — Option C: Unsigned pass-through (D-14 blocked on SignPath Foundation tier) ──
  sign:
    name: 🔐 Code Signing (UNSIGNED — SignPath Foundation blocked)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: dist/

      - name: Pass-through (no signing — Foundation tier limitation)
        run: |
          ls -la dist/
          echo "⚠️  SignPath Foundation does not support CI signing."
          echo "     exe is UNSIGNED — SmartScreen warning expected on first run."
          echo "     Size: $(du -sh dist/JARVIS.exe | cut -f1)"

      - name: Upload as signed artifact (unsigned pass-through)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-exe
          path: "dist/JARVIS.exe"
          retention-days: 90

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: 📦 Publish GitHub Release
    runs-on: windows-latest
    needs: [build, sign]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-signed-exe
          path: dist/

      - name: Create release archive
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $archiveName = "JARVIS_v${ver}_windows_x64.zip"
          Compress-Archive -Path "dist/JARVIS.exe" -DestinationPath $archiveName -Force
          $sz = [math]::Round((Get-Item $archiveName).Length / 1MB, 1)
          Write-Host "Archive: $archiveName ($sz MB)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS v${{ needs.build.outputs.version }}"
          body: |
            ## JARVIS v${{ needs.build.outputs.version }}

            > ⚠️ **Note**: This build is **unsigned** (no Authenticode signature). Windows SmartScreen may show a warning on first launch — click "More info → Run anyway". This is a known limitation of the current free tier signing plan. A properly signed release is planned for v5.2.0 final.

            ### 📥 Download & Install

            | File | Description |
            |------|-------------|
            | `JARVIS_v${{ needs.build.outputs.version }}_windows_x64.zip` | Standalone .exe (extract & run, unsigned) |

            **Quick Start:**
            1. Download and extract the ZIP
            2. Double-click `JARVIS.exe` or run `JARVIS.exe --tray`
            3. If SmartScreen appears: click **More info → Run anyway**
            4. JARVIS appears in your system tray ⚡

            **Full installation guide:** See [README.md](https://github.com/Duong-Phuoc-Hung/JARVIS#readme)

            ### 📋 What's Changed
            See [CHANGELOG.md](https://github.com/Duong-Phuoc-Hung/JARVIS/blob/main/CHANGELOG.md)

            ---
            *Built automatically from tag `${{ github.ref_name }}` by GitHub Actions*
          files: "*.zip"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
