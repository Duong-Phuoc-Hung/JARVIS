name: JARVIS Release — Build .EXE & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows .EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        env:
          PYTHONIOENCODING: utf-8

      - name: 🧪 Run tests before build
        run: |
          python -m pytest tests/unit/ -q --tb=short --no-header -rN
        env:
          PYTHONIOENCODING: utf-8
          JARVIS_HEADLESS: "1"
          JARVIS_MOCK_AUDIO: "1"

      - name: 🏗️ Build .EXE with PyInstaller
        run: |
          python build.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 📊 Generate version status
        run: |
          python scripts/health_check_report.py
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 📦 Create release ZIP
        run: |
          $tag = "${{ github.ref_name }}"
          $zip_name = "JARVIS_${tag}_windows.zip"
          Compress-Archive -Path dist/JARVIS.exe, README.md, CHANGELOG.md, requirements.txt -DestinationPath $zip_name
          echo "ZIP_NAME=$zip_name" >> $env:GITHUB_ENV
        shell: pwsh

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            reports/version_status.json
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Notify via Telegram (optional)
        run: |
          $tag = "${{ github.ref_name }}"
          $msg = "JARVIS $tag da duoc phat hanh! Tai ve tai: https://github.com/Duong-Phuoc-Hung/JARVIS/releases/tag/$tag"
          Write-Host "Release notification: $msg"
        shell: pwsh
        continue-on-error: true
