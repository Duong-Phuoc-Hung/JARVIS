name: JARVIS Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  JARVIS_SANDBOX_ALLOW_COMPAT_FALLBACK: "1"

jobs:
  # ── Build Windows .exe ─────────────────────────────────────────
  build:
    name: 🏗️ Build Windows Executable
    runs-on: windows-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}
      exe_size: ${{ steps.build.outputs.exe_size }}
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          pip install pyinstaller --quiet

      - name: Install Windows deps
        run: pip install pywin32 pystray keyboard sounddevice --quiet
        continue-on-error: true

      - name: Run tests before build
        run: |
          python -m pytest tests/unit/ -q --timeout=60 --tb=short
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "All tests passed — proceeding with build"

      - name: Build JARVIS.exe
        id: build
        run: |
          python scripts/build_installer.py --exe-only --skip-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-Item "dist/JARVIS.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          echo "exe_size=$sizeMB MB" >> $env:GITHUB_OUTPUT
          Write-Host "Built: dist/JARVIS.exe ($sizeMB MB)"

      - name: Upload UNSIGNED artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: "dist/JARVIS.exe"
          retention-days: 7

  # ── Code Signing — Authenticode & Trust Tiering Gate (R1) ───────────
  sign:
    name: 🔐 Code Signing (Authenticode Trust Gate)
    runs-on: windows-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      is_commercial: ${{ steps.sign_step.outputs.is_commercial }}
      signature_tier: ${{ steps.sign_step.outputs.signature_tier }}

    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: dist/

      - name: Sign JARVIS.exe with Authenticode & Trust Gate
        id: sign_step
        shell: pwsh
        env:
          COMMERCIAL_PFX_BASE64: ${{ secrets.COMMERCIAL_PFX_BASE64 }}
          COMMERCIAL_PFX_PASSWORD: ${{ secrets.COMMERCIAL_PFX_PASSWORD }}
          COMMERCIAL_CERT_THUMBPRINT: ${{ secrets.COMMERCIAL_CERT_THUMBPRINT }}
          REQUIRE_COMMERCIAL_RELEASE: ${{ vars.REQUIRE_COMMERCIAL_RELEASE }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $exePath = "dist/JARVIS.exe"
          if (-not (Test-Path $exePath)) {
              throw "Target executable not found: $exePath"
          }

          Write-Host "=== 1. Locating Windows SDK signtool.exe ==="
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
              $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                           Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          if (-not $signtool -or -not (Test-Path $signtool)) {
              throw "signtool.exe could not be found in Windows Kits or PATH!"
          }
          Write-Host "Using signtool: $signtool"

          Write-Host "`n=== 2. Creating Ephemeral Code Signing Certificate ==="
          $isCommercialAttempt = $false
          $isCommercial = $false
          $signatureTier = "TEST_SIGNED"
          $expectedThumbprint = ""

          if ($env:COMMERCIAL_PFX_BASE64 -or $env:COMMERCIAL_PFX_PASSWORD -or $env:COMMERCIAL_CERT_THUMBPRINT) {
              if (-not ($env:COMMERCIAL_PFX_BASE64 -and $env:COMMERCIAL_PFX_PASSWORD -and $env:COMMERCIAL_CERT_THUMBPRINT)) {
                  throw "FAIL-CLOSED: Incomplete commercial signing configuration. COMMERCIAL_PFX_BASE64, COMMERCIAL_PFX_PASSWORD, and COMMERCIAL_CERT_THUMBPRINT are all required."
              }
              Write-Host "`n=== 2. Using Configured Commercial PFX Certificate ==="
              $pfxPath = Join-Path $env:TEMP "jarvis_commercial.pfx"
              [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:COMMERCIAL_PFX_BASE64))
              $pfxPassword = $env:COMMERCIAL_PFX_PASSWORD
              $expectedThumbprint = ($env:COMMERCIAL_CERT_THUMBPRINT -replace '[\s:]', '').ToUpper()
              $isCommercialAttempt = $true
              Write-Host "Commercial PFX unpacked successfully. Expected Thumbprint: $expectedThumbprint"
          } else {
              $tag = "${{ github.ref_name }}"
              $isPrereleaseTag = ($tag -match 'alpha|beta|rc')
              if (-not $isPrereleaseTag -and $env:REQUIRE_COMMERCIAL_RELEASE -eq 'true') {
                  throw "FAIL-CLOSED: Tag '$tag' is a production release tag, but no commercial certificate was found. Commercial Authenticode signing is required."
              }
              Write-Warning "No commercial signing credentials configured. Generating development self-signed certificate."
              Write-Warning "Per Three-Tier Verdict Discipline, artifact is marked as TEST_SIGNED and restricted to PRERELEASE status."
              Write-Host "`n=== 2. Creating Ephemeral Code Signing Certificate ==="
              $cert = New-SelfSignedCertificate `
                  -Type CodeSigningCert `
                  -Subject "CN=JARVIS AI Assistant (CI Self-Signed), O=JARVIS Project" `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -KeyExportPolicy Exportable `
                  -KeyUsage DigitalSignature `
                  -KeyLength 2048 `
                  -HashAlgorithm SHA256 `
                  -NotAfter (Get-Date).AddYears(5)

              Write-Host "Created certificate: $($cert.Subject) (Thumbprint: $($cert.Thumbprint))"

              Write-Host "`n=== 3. Exporting PFX ==="
              $pfxPassword = [System.Guid]::NewGuid().ToString("N")
              $secPassword = ConvertTo-SecureString -String $pfxPassword -Force -AsPlainText
              $pfxPath = Join-Path $env:TEMP "jarvis_codesign.pfx"
              Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secPassword | Out-Null
              Write-Host "PFX exported to $pfxPath"
          }

          Write-Host "`n=== 4. Signing JARVIS.exe with Timestamp Fallback ==="
          $tsaList = @(
              "http://timestamp.digicert.com",
              "http://timestamp.sectigo.com",
              "http://time.certum.pl"
          )

          $signed = $false
          foreach ($tsa in $tsaList) {
              Write-Host "Attempting sign with TSA: $tsa"
              for ($attempt = 1; $attempt -le 2; $attempt++) {
                  & "$signtool" sign /f "$pfxPath" /p "$pfxPassword" /fd SHA256 /tr "$tsa" /td SHA256 /v "$exePath"
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Successfully signed with TSA: $tsa (attempt $attempt)"
                      $signed = $true
                      break
                  }
                  Write-Warning "Attempt $attempt failed for TSA $tsa. Retrying in 2 seconds..."
                  Start-Sleep -Seconds 2
              }
              if ($signed) { break }
          }

          if (-not $signed) {
              Write-Warning "All timestamp authorities unreachable. Signing without timestamp fallback..."
              & "$signtool" sign /f "$pfxPath" /p "$pfxPassword" /fd SHA256 /v "$exePath"
              if ($LASTEXITCODE -ne 0) {
                  throw "signtool sign failed without timestamp (exit code $LASTEXITCODE)!"
              }
              Write-Host "Successfully signed without TSA."
          }

          Write-Host "`n=== 5. Verifying Authenticode Signature & Trust Tiering ==="
          $sig = Get-AuthenticodeSignature "$exePath"
          Write-Host "Authenticode Status:        $($sig.Status)"
          Write-Host "Authenticode StatusMessage:   $($sig.StatusMessage)"
          if ($null -eq $sig.SignerCertificate) {
              throw "AUTHENTICODE VERIFICATION FAILED: No SignerCertificate found on $exePath!"
          }
          $actualThumbprint = ($sig.SignerCertificate.Thumbprint -replace '[\s:]', '').ToUpper()
          Write-Host "Signer Subject:              $($sig.SignerCertificate.Subject)"
          Write-Host "Signer Thumbprint:           $actualThumbprint"
          if ($sig.TimeStamperCertificate) {
              Write-Host "TSA Subject:                 $($sig.TimeStamperCertificate.Subject)"
          }

          if ($isCommercialAttempt) {
              if ($sig.Status -ne [System.Management.Automation.SignatureStatus]::Valid -and $sig.Status -ne 'Valid') {
                  throw "AUTHENTICODE VERIFICATION FAILED: Commercial executable signature status is '$($sig.Status)', expected Valid ($($sig.StatusMessage))!"
              }
              if ($actualThumbprint -ne $expectedThumbprint) {
                  throw "AUTHENTICODE VERIFICATION FAILED: Signer thumbprint '$actualThumbprint' does not match expected approved thumbprint '$expectedThumbprint'!"
              }
              $isCommercial = $true
              $signatureTier = "COMMERCIAL"
              Write-Host "COMMERCIAL Authenticode signature verified successfully. Thumbprint matched approved certificate: $actualThumbprint"
          } else {
              if ($sig.Status -notin @([System.Management.Automation.SignatureStatus]::Valid, 'Valid', 'UnknownError')) {
                  throw "AUTHENTICODE VERIFICATION FAILED: Self-signed executable has invalid status: $($sig.Status) ($($sig.StatusMessage))!"
              }
              $isCommercial = $false
              $signatureTier = "TEST_SIGNED"
              Write-Host "Self-signed Authenticode signature verified successfully: Status = $($sig.Status)"
          }

          Write-Host "`n=== 6. Outputting Trust Metadata ==="
          Write-Host "Is Commercial: $isCommercial"
          Write-Host "Signature Tier: $signatureTier"
          echo "is_commercial=$($isCommercial.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          echo "signature_tier=$signatureTier" >> $env:GITHUB_OUTPUT

          Write-Host "`n=== 7. Cleanup ==="
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "PFX removed."

      - name: Upload as signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-exe
          path: "dist/JARVIS.exe"
          retention-days: 90

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: 📦 Publish GitHub Release
    runs-on: windows-latest
    needs: [build, sign]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-signed-exe
          path: dist/

      - name: Create release archive
        shell: pwsh
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $archiveName = "JARVIS_v${ver}_windows_x64.zip"
          Compress-Archive -Path "dist/JARVIS.exe" -DestinationPath $archiveName -Force
          $sz = [math]::Round((Get-Item $archiveName).Length / 1MB, 1)
          Write-Host "Archive: $archiveName ($sz MB)"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS v${{ needs.build.outputs.version }}"
          body: |
            ## JARVIS v${{ needs.build.outputs.version }}

            > ℹ️ **Code Signing & Integrity**: `JARVIS.exe` is **Authenticode-signed** with a self-signed certificate for cryptographic integrity and tamper protection. Because the certificate is self-signed (not issued by a commercial Certificate Authority like DigiCert or Sectigo), Windows SmartScreen will display an "Unknown Publisher" prompt on first launch — click **"More info → Run anyway"** to proceed.

            ### 📥 Download & Install

            | File | Description |
            |------|-------------|
            | `JARVIS_v${{ needs.build.outputs.version }}_windows_x64.zip` | Standalone .exe (extract & run, Authenticode signed) |

            **Quick Start:**
            1. Download and extract the ZIP
            2. Double-click `JARVIS.exe` or run `JARVIS.exe --tray`
            3. If SmartScreen appears: click **More info → Run anyway**
            4. JARVIS appears in your system tray ⚡

            **Full installation guide:** See [README.md](https://github.com/Duong-Phuoc-Hung/JARVIS#readme)

            ### 📋 What's Changed
            See [CHANGELOG.md](https://github.com/Duong-Phuoc-Hung/JARVIS/blob/main/CHANGELOG.md)

            ---
            *Built automatically from tag `${{ github.ref_name }}` by GitHub Actions*
          files: "*.zip"
          draft: false
          prerelease: ${{ needs.sign.outputs.is_commercial != 'true' || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
