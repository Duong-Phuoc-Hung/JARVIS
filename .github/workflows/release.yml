name: JARVIS Release — Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  JARVIS_SANDBOX_ALLOW_COMPAT_FALLBACK: "1"

jobs:
  # ── Build Windows .exe ─────────────────────────────────────────
  build:
    name: 🏗️ Build Windows Executable
    runs-on: windows-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}
      exe_size: ${{ steps.build.outputs.exe_size }}
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet
          pip install pyinstaller --quiet

      - name: Install Windows deps
        run: pip install pywin32 pystray keyboard sounddevice --quiet
        continue-on-error: true

      - name: Run tests before build
        run: |
          python -m pytest tests/unit/ -q --timeout=60 --tb=short
          Write-Host "All tests passed — proceeding with build"

      - name: Build JARVIS.exe
        id: build
        run: |
          python scripts/build_installer.py --exe-only --skip-tests
          $exe = Get-Item "dist/JARVIS.exe"
          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          echo "exe_size=$sizeMB MB" >> $env:GITHUB_OUTPUT
          Write-Host "Built: dist/JARVIS.exe ($sizeMB MB)"

      - name: Create release archive
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $archiveName = "JARVIS_v${ver}_windows_x64.zip"
          Compress-Archive -Path "dist/JARVIS.exe" -DestinationPath $archiveName -Force
          Write-Host "Archive: $archiveName"
          echo "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

      - name: Upload UNSIGNED artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: "dist/JARVIS.exe"
          retention-days: 7

  # ── Sign with SignPath (D-14) ───────────────────────────────────
  sign:
    name: 🔐 Code Signing (SignPath Foundation — Direct API)
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-unsigned-exe
          path: unsigned/

      - name: Sign JARVIS.exe via SignPath REST API (direct)
        id: signing
        shell: pwsh
        run: |
          $orgId  = "${{ secrets.SIGNPATH_ORG_ID }}"
          $token  = "${{ secrets.SIGNPATH_API_TOKEN }}"
          $exe    = "unsigned/JARVIS.exe"
          $outDir = "signed-output"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $headers = @{ "Authorization" = "Bearer $token" }

          # ── 1. Submit signing request ─────────────────────────────
          Write-Host "Submitting signing request to SignPath..."
          $form = @{
            ProjectSlug                  = "Jarvis"
            SigningPolicySlug            = "Jarvis_Test_Signing"
            ArtifactConfigurationSlug    = "initial"
            Artifact = Get-Item $exe
          }
          $resp = Invoke-RestMethod `
            -Uri "https://app.signpath.io/api/v1/$orgId/signing-requests" `
            -Method POST `
            -Headers $headers `
            -Form $form
          $reqId  = $resp.signingRequestId
          $reqUrl = "https://app.signpath.io/api/v1/$orgId/signing-requests/$reqId"
          Write-Host "Signing request created: $reqId"

          # ── 2. Poll until completed ───────────────────────────────
          Write-Host "Polling for completion (timeout 10min)..."
          $deadline = (Get-Date).AddMinutes(10)
          $status   = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $sr     = Invoke-RestMethod -Uri $reqUrl -Headers $headers
            $status = $sr.status
            Write-Host "  Status: $status"
            if ($status -in "Completed","Failed","Denied","Canceled") { break }
          }

          if ($status -ne "Completed") {
            Write-Error "Signing did not complete. Final status: $status"
            exit 1
          }

          # ── 3. Download signed artifact ───────────────────────────
          Write-Host "Downloading signed artifact..."
          $dlHeaders = $headers + @{ "Accept" = "application/octet-stream" }
          Invoke-WebRequest `
            -Uri "$reqUrl/signed-artifact" `
            -Headers $dlHeaders `
            -OutFile "$outDir/JARVIS.exe"
          $sz = [math]::Round((Get-Item "$outDir/JARVIS.exe").Length / 1MB, 2)
          Write-Host "Signed JARVIS.exe downloaded: $sz MB"

      - name: Verify signed artifact
        shell: pwsh
        run: |
          $f = "signed-output/JARVIS.exe"
          if (-not (Test-Path $f)) { Write-Error "Signed artifact missing!"; exit 1 }
          $sz = [math]::Round((Get-Item $f).Length / 1MB, 2)
          Write-Host "Signed artifact: $sz MB"
          # Show Authenticode signature info
          $sig = Get-AuthenticodeSignature $f
          Write-Host "Signature status : $($sig.Status)"
          Write-Host "Signer           : $($sig.SignerCertificate?.Subject)"

      - name: Upload SIGNED artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-signed-exe
          path: "signed-output/JARVIS.exe"
          retention-days: 90

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: 📦 Publish GitHub Release
    runs-on: windows-latest
    needs: [build, sign]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download SIGNED artifact
        uses: actions/download-artifact@v4
        with:
          name: jarvis-signed-exe
          path: dist/

      - name: Create release archive (signed)
        run: |
          $ver = "${{ needs.build.outputs.version }}"
          $archiveName = "JARVIS_v${ver}_windows_x64.zip"
          Compress-Archive -Path "dist/JARVIS.exe" -DestinationPath $archiveName -Force
          Write-Host "Signed archive: $archiveName"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "JARVIS v${{ steps.version.outputs.version }}"
          body: |
            ## JARVIS v${{ steps.version.outputs.version }}

            ### 📥 Download & Install

            | File | Description |
            |------|-------------|
            | `JARVIS_v${{ steps.version.outputs.version }}_windows_x64.zip` | Standalone .exe (extract & run) |

            **Quick Start:**
            1. Download and extract the ZIP
            2. Double-click `JARVIS.exe` or run `JARVIS.exe --tray`
            3. JARVIS appears in your system tray ⚡

            **Full installation guide:** See [README.md](https://github.com/Duong-Phuoc-Hung/JARVIS#readme)

            ### 📋 What's Changed
            See [CHANGELOG.md](https://github.com/Duong-Phuoc-Hung/JARVIS/blob/main/CHANGELOG.md)

            ---
            *Built automatically from tag `${{ github.ref_name }}` by GitHub Actions*
            *Tests: release workflow test suite passed | Size: ${{ steps.build.outputs.exe_size }}*
          files: "*.zip"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
