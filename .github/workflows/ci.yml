name: JARVIS CI — Professional Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  FORCE_COLOR: "1"

jobs:
  # ══════════════════════════════════════════════════════
  # JOB 1 ─ Syntax & Lint  (~25s)
  # ══════════════════════════════════════════════════════
  lint:
    name: 🔍 Syntax & Lint
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install pyflakes ruff --quiet

      - name: Ruff — lint all sources
        run: |
          python -m ruff check jarvis/ --output-format=github --quiet
        continue-on-error: true

      - name: Syntax check — all .py files
        run: |
          $files = Get-ChildItem -Recurse -Filter "*.py" jarvis/ | Select-Object -ExpandProperty FullName
          $failed = @()
          foreach ($f in $files) {
            python -m py_compile $f 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed += $f }
          }
          if ($failed.Count -gt 0) {
            Write-Host "SYNTAX ERRORS in:"
            $failed | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "All $($files.Count) Python files: syntax OK"

  # ══════════════════════════════════════════════════════
  # JOB 2 ─ Full Test Suite  (~2m)
  # ══════════════════════════════════════════════════════
  test:
    name: 🧪 Unit Tests
    runs-on: windows-latest
    timeout-minutes: 25
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install — core packages (required)
        run: |
          python -m pip install --upgrade pip --quiet
          pip install `
            "google-generativeai>=0.8" `
            "python-dotenv>=1.0" `
            "numpy>=1.24" `
            "Pillow>=10" `
            "requests>=2.31" `
            "psutil>=5.9" `
            "pyperclip>=1.8" `
            "pytest>=8.0" `
            "pytest-subtests>=0.12" `
            "pytest-timeout>=2.2" `
            "pytest-cov>=5.0" `
            --quiet

      - name: Install — Windows packages
        run: pip install pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Install — audio packages
        run: pip install sounddevice --quiet
        continue-on-error: true

      - name: Install — communication packages
        run: pip install python-telegram-bot --quiet
        continue-on-error: true

      - name: Show installed packages
        run: pip list --format=columns | Select-String "numpy|pytest|google|PIL|psutil|pystray"

      - name: Create required directories
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          New-Item -ItemType Directory -Force -Path logs    | Out-Null

      - name: Run test suite
        id: pytest
        run: |
          python -m pytest tests/unit/ `
            --tb=short `
            --no-header `
            -q `
            --timeout=60 `
            --junit-xml=reports/junit.xml `
            --cov=jarvis `
            --cov-report=xml:reports/coverage.xml `
            --cov-report=term-missing:skip-covered `
            2>&1 | Tee-Object reports/test_output.txt

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "JARVIS Test Results"
          path: "reports/junit.xml"
          reporter: java-junit
          fail-on-error: false
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30

  # ══════════════════════════════════════════════════════
  # JOB 3 ─ Module Import Validation  (~20s)
  # ══════════════════════════════════════════════════════
  import-check:
    name: 📦 Import Validation
    runs-on: windows-latest
    timeout-minutes: 8
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install "google-generativeai>=0.8" "python-dotenv>=1.0" `
            "numpy>=1.24" "Pillow>=10" "requests>=2.31" `
            "psutil>=5.9" "pyperclip>=1.8" --quiet
          pip install pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Validate module imports
        run: |
          python -c @"
          import sys, importlib

          REQUIRED = [
              'jarvis.memory.vector_store',
              'jarvis.workers.auto_updater',
              'jarvis.workers.notification_hub',
              'jarvis.workers.night_shift',
              'jarvis.browser.cdp_controller',
              'jarvis.plugins.loader',
              'jarvis.agent.graph',
              'jarvis.comms.zalo',
              'jarvis.skills.skill_synthesizer',
              'jarvis.skills.rag_search',
              'jarvis.skills.browser_control',
              'jarvis.skills.auto_updater',
              'jarvis.skills.night_planner',
              'jarvis.skills.sound_board',
          ]

          OPTIONAL_DEPS = frozenset({
              'playwright', 'webrtcvad', 'onnxruntime',
              'faster_whisper', 'piper', 'winotify',
              'sounddevice', 'discord', 'telegram',
              'pyaudio', 'pywin32',
          })

          failed = []
          skipped = []

          for mod in REQUIRED:
              try:
                  importlib.import_module(mod)
                  print(f'  PASS  {mod}')
              except ImportError as exc:
                  msg = str(exc)
                  # Check if it's a known optional dependency
                  is_optional = any(opt in msg for opt in OPTIONAL_DEPS)
                  if is_optional:
                      print(f'  SKIP  {mod}  (optional: {msg})')
                      skipped.append(mod)
                  else:
                      print(f'  FAIL  {mod}: {msg}')
                      failed.append((mod, msg))
              except Exception as exc:
                  print(f'  ERR   {mod}: {type(exc).__name__}: {exc}')
                  failed.append((mod, str(exc)))

          print()
          print(f'Results: {len(REQUIRED) - len(failed) - len(skipped)} pass / {len(skipped)} skip / {len(failed)} fail')

          if failed:
              print('FAILED:')
              for mod, err in failed:
                  print(f'  - {mod}: {err}')
              sys.exit(1)
          "@

  # ══════════════════════════════════════════════════════
  # JOB 4 ─ Security Scan  (~30s)
  # ══════════════════════════════════════════════════════
  security:
    name: 🔒 Security Scan
    runs-on: windows-latest
    timeout-minutes: 8
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Bandit
        run: pip install bandit --quiet

      - name: Run Bandit security scan
        run: |
          python -m bandit -r jarvis/ `
            --skip B101,B311,B603,B607 `
            --severity-level medium `
            --confidence-level medium `
            -f txt `
            -o reports/bandit_report.txt
        continue-on-error: true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: reports/bandit_report.txt
          retention-days: 30

  # ══════════════════════════════════════════════════════
  # JOB 5 ─ Final Summary  (always runs)
  # ══════════════════════════════════════════════════════
  summary:
    name: 📊 Pipeline Summary
    runs-on: windows-latest
    timeout-minutes: 3
    needs: [lint, test, import-check, security]
    if: always()

    steps:
      - name: Pipeline result
        run: |
          $results = @{
            "Lint"          = "${{ needs.lint.result }}"
            "Unit Tests"    = "${{ needs.test.result }}"
            "Import Check"  = "${{ needs.import-check.result }}"
            "Security"      = "${{ needs.security.result }}"
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "  JARVIS CI — Pipeline Summary"
          Write-Host "  Run #${{ github.run_number }} | ${{ github.ref_name }}"
          Write-Host "=============================================="
          $allOk = $true
          foreach ($job in $results.GetEnumerator()) {
            $icon = if ($job.Value -eq "success") { "PASS" } `
                    elseif ($job.Value -eq "skipped") { "SKIP" } `
                    else { "FAIL"; $allOk = $false }
            Write-Host ("  {0,-20} {1}" -f $job.Key, $icon)
          }
          Write-Host "=============================================="
          if ($allOk) {
            Write-Host "  STATUS: ALL PASSED"
            Write-Host ""
          } else {
            Write-Host "  STATUS: FAILED — see individual jobs above"
            Write-Host ""
            exit 1
          }
