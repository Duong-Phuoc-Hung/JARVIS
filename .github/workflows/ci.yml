name: JARVIS CI — Tests, Lint & Health Report

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1 — Syntax & Lint  (nhanh ~20s)
  # ══════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Syntax & Lint Check
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install lint deps only
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes
        env:
          PYTHONIOENCODING: utf-8

      - name: 🔍 Syntax — Core modules
        run: |
          python -m py_compile jarvis/__init__.py
          python -m py_compile jarvis/audio/vad.py
          python -m py_compile jarvis/audio/fullduplex.py
          python -m py_compile jarvis/audio/sound_effects.py
          python -m py_compile jarvis/tts/piper.py
          python -m py_compile jarvis/stt/faster_whisper.py
          python -m py_compile jarvis/memory/vector_store.py
          python -m py_compile jarvis/workers/night_shift.py
          python -m py_compile jarvis/workers/auto_updater.py
          python -m py_compile jarvis/workers/notification_hub.py
          Write-Host "Core: OK"

      - name: 🔍 Syntax — Communications
        run: |
          python -m py_compile jarvis/comms/discord.py
          python -m py_compile jarvis/comms/mobile_bridge.py
          python -m py_compile jarvis/comms/zalo.py
          Write-Host "Comms: OK"

      - name: 🔍 Syntax — v3.1-v4.0 modules
        run: |
          python -m py_compile jarvis/browser/cdp_controller.py
          python -m py_compile jarvis/plugins/loader.py
          python -m py_compile jarvis/agent/graph.py
          Write-Host "New modules: OK"

      - name: 🔍 Syntax — Skills
        run: |
          python -m py_compile jarvis/skills/screen_context/__init__.py
          python -m py_compile jarvis/skills/macro_recorder/__init__.py
          python -m py_compile jarvis/skills/skill_synthesizer/__init__.py
          python -m py_compile jarvis/skills/rag_search/__init__.py
          python -m py_compile jarvis/skills/night_planner/__init__.py
          python -m py_compile jarvis/skills/smart_home_discovery/__init__.py
          python -m py_compile jarvis/skills/sound_board/__init__.py
          python -m py_compile jarvis/skills/browser_control/__init__.py
          python -m py_compile jarvis/skills/auto_updater/__init__.py
          Write-Host "Skills: OK"

      - name: 🔍 Syntax — Scripts
        run: |
          python -m py_compile scripts/build_installer.py
          python -m py_compile scripts/health_check_report.py
          Write-Host "Scripts: OK"

  # ══════════════════════════════════════════════════════════════
  # JOB 2 — Full Test Suite (phụ thuộc lint)
  # ══════════════════════════════════════════════════════════════
  test:
    name: 🧪 Unit Tests (633 tests)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install `
            google-generativeai `
            python-dotenv `
            numpy `
            Pillow `
            requests `
            psutil `
            pyperclip `
            pytest `
            pytest-subtests `
            pytest-timeout
        env:
          PYTHONIOENCODING: utf-8

      - name: 📦 Install Windows-specific dependencies
        run: |
          pip install pywin32 pystray keyboard
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 📦 Install optional audio dependencies
        run: |
          pip install sounddevice
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 📦 Install communication dependencies
        run: |
          pip install python-telegram-bot
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 🧪 Run full test suite
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          python -m pytest tests/unit/ `
            --tb=short `
            --no-header `
            -q `
            --timeout=60 `
            --junit-xml=reports/junit_results.xml `
            2>&1 | Tee-Object -FilePath reports/test_output.txt
        env:
          PYTHONIOENCODING: utf-8
          JARVIS_HEADLESS: "1"
          JARVIS_MOCK_AUDIO: "1"

      - name: 📊 Test summary
        if: always()
        run: |
          Write-Host "=========================================="
          Write-Host " TEST RESULTS"
          Write-Host "=========================================="
          if (Test-Path reports/test_output.txt) {
            Get-Content reports/test_output.txt | Select-Object -Last 15
          }
          Write-Host "=========================================="

      - name: 🩺 Health report
        if: success()
        run: python scripts/health_check_report.py
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # JOB 3 — Module Import Validation (phụ thuộc lint)
  # ══════════════════════════════════════════════════════════════
  import-check:
    name: 📦 Module Import Validation
    runs-on: windows-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install minimal deps for import check
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai python-dotenv numpy Pillow requests psutil pyperclip
          pip install pywin32 pystray keyboard
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true

      - name: 🔌 Validate module imports
        run: |
          python -c "
          import sys, importlib

          # Modules that MUST import cleanly
          required = [
              'jarvis.memory.vector_store',
              'jarvis.workers.auto_updater',
              'jarvis.workers.notification_hub',
              'jarvis.workers.night_shift',
              'jarvis.browser.cdp_controller',
              'jarvis.plugins.loader',
              'jarvis.agent.graph',
              'jarvis.comms.zalo',
              'jarvis.skills.skill_synthesizer',
              'jarvis.skills.rag_search',
              'jarvis.skills.browser_control',
              'jarvis.skills.auto_updater',
          ]

          # Packages that may be absent on CI (optional deps)
          OPTIONAL_ERRORS = {
              'playwright', 'webrtcvad', 'onnxruntime',
              'faster_whisper', 'piper', 'winotify',
              'sounddevice', 'discord',
          }

          failed = []
          for mod in required:
              try:
                  importlib.import_module(mod)
                  print(f'  OK   {mod}')
              except ImportError as e:
                  dep = str(e).split(\"'\")[-2] if \"'\" in str(e) else str(e)
                  if any(opt in dep for opt in OPTIONAL_ERRORS):
                      print(f'  --   {mod} (optional dep missing: {dep})')
                  else:
                      print(f'  FAIL {mod}: {e}')
                      failed.append(mod)
              except Exception as e:
                  print(f'  ERR  {mod}: {type(e).__name__}: {e}')
                  failed.append(mod)

          print()
          if failed:
              print(f'FAILED imports: {failed}')
              sys.exit(1)
          print('All required imports: OK')
          "
        env:
          PYTHONIOENCODING: utf-8
          JARVIS_HEADLESS: "1"
          JARVIS_MOCK_AUDIO: "1"

  # ══════════════════════════════════════════════════════════════
  # JOB 4 — CI Summary  (luôn chạy)
  # ══════════════════════════════════════════════════════════════
  summary:
    name: 📊 CI Summary
    runs-on: windows-latest
    timeout-minutes: 5
    needs: [lint, test, import-check]
    if: always()

    steps:
      - name: 📊 Final result board
        run: |
          Write-Host "=============================================="
          Write-Host "  JARVIS CI PIPELINE — FINAL RESULTS"
          Write-Host "=============================================="
          Write-Host "  Lint / Syntax:     ${{ needs.lint.result }}"
          Write-Host "  Unit Tests:        ${{ needs.test.result }}"
          Write-Host "  Import Check:      ${{ needs.import-check.result }}"
          Write-Host "=============================================="

          $failed = @()
          if ("${{ needs.lint.result }}" -eq "failure")        { $failed += "Lint" }
          if ("${{ needs.test.result }}" -eq "failure")        { $failed += "Tests" }
          if ("${{ needs.import-check.result }}" -eq "failure") { $failed += "ImportCheck" }

          if ($failed.Count -gt 0) {
            Write-Host "  STATUS: FAILED ($($failed -join ', '))"
            Write-Host "  -> Check the failed jobs above for details"
            exit 1
          } else {
            Write-Host "  STATUS: ALL PASSED"
          }
