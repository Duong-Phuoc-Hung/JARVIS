name: JARVIS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"

jobs:
  # ────────────────────────────────────────────────────────
  # JOB 1 ─ Syntax Check  (nhanh ~20s, không cần packages)
  # ────────────────────────────────────────────────────────
  syntax:
    name: 🔍 Syntax Check
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check Python syntax (py_compile all files)
        run: |
          $errors = @()
          $files = Get-ChildItem -Path "jarvis" -Recurse -Filter "*.py" | Select-Object -ExpandProperty FullName
          Write-Host "Checking $($files.Count) Python files..."
          foreach ($f in $files) {
            $out = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              $errors += "  FAIL: $f"
              $errors += "        $out"
            }
          }
          if ($errors.Count -gt 0) {
            Write-Host "SYNTAX ERRORS FOUND:"
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host "All $($files.Count) files OK"

  # ────────────────────────────────────────────────────────
  # JOB 2 ─ Unit Tests  (phụ thuộc syntax)
  # ────────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: windows-latest
    timeout-minutes: 25
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install required packages
        run: |
          python -m pip install --upgrade pip --quiet
          pip install `
            "google-generativeai" `
            "python-dotenv" `
            "numpy" `
            "Pillow" `
            "requests" `
            "psutil" `
            "pyperclip" `
            "pytest" `
            "pytest-subtests" `
            "pytest-timeout" `
            --quiet

      - name: Install Windows packages
        run: pip install pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Install audio packages
        run: pip install sounddevice --quiet
        continue-on-error: true

      - name: Install bot packages
        run: pip install python-telegram-bot --quiet
        continue-on-error: true

      - name: Prepare report dirs
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          New-Item -ItemType Directory -Force -Path logs    | Out-Null

      - name: Run test suite
        run: |
          python -m pytest tests/unit/ `
            --tb=short -q --timeout=60 `
            --junit-xml=reports/junit.xml `
            2>&1 | Tee-Object reports/test_output.txt

      - name: Print result summary
        if: always()
        run: |
          Write-Host "=== LAST 10 LINES OF TEST OUTPUT ==="
          Get-Content reports/test_output.txt | Select-Object -Last 10

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14

  # ────────────────────────────────────────────────────────
  # JOB 3 ─ Import Validation  (phụ thuộc syntax)
  # ────────────────────────────────────────────────────────
  imports:
    name: 📦 Import Validation
    runs-on: windows-latest
    timeout-minutes: 8
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip --quiet
          pip install google-generativeai python-dotenv numpy Pillow requests psutil pyperclip --quiet
          pip install pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Validate imports
        run: |
          python -c "
          import sys, importlib

          modules = [
              'jarvis.memory.vector_store',
              'jarvis.workers.auto_updater',
              'jarvis.workers.notification_hub',
              'jarvis.agent.graph',
              'jarvis.comms.zalo',
              'jarvis.browser.cdp_controller',
              'jarvis.plugins.loader',
              'jarvis.skills.rag_search',
              'jarvis.skills.skill_synthesizer',
              'jarvis.skills.browser_control',
              'jarvis.skills.auto_updater',
              'jarvis.skills.night_planner',
          ]
          OPTIONAL = {'playwright','webrtcvad','onnxruntime','faster_whisper',
                      'piper','winotify','sounddevice','discord','telegram'}
          failed = []
          for mod in modules:
              try:
                  importlib.import_module(mod)
                  print(f'  OK  {mod}')
              except ImportError as e:
                  if any(o in str(e) for o in OPTIONAL):
                      print(f'  --  {mod} (optional dep: {e})')
                  else:
                      print(f'  ERR {mod}: {e}')
                      failed.append(mod)
              except Exception as e:
                  print(f'  ERR {mod}: {e}')
                  failed.append(mod)
          if failed:
              print(f'FAILED: {failed}')
              sys.exit(1)
          print('All imports: OK')
          "

  # ────────────────────────────────────────────────────────
  # JOB 4 ─ Summary  (luôn chạy)
  # ────────────────────────────────────────────────────────
  summary:
    name: 📊 Summary
    runs-on: windows-latest
    needs: [syntax, test, imports]
    if: always()
    timeout-minutes: 3

    steps:
      - name: Print pipeline result
        run: |
          Write-Host "============================================"
          Write-Host "  JARVIS CI RESULTS"
          Write-Host "============================================"
          Write-Host "  Syntax:   ${{ needs.syntax.result }}"
          Write-Host "  Tests:    ${{ needs.test.result }}"
          Write-Host "  Imports:  ${{ needs.imports.result }}"
          Write-Host "============================================"
          $bad = @()
          if ("${{ needs.syntax.result }}" -ne "success") { $bad += "Syntax" }
          if ("${{ needs.test.result }}"  -ne "success") { $bad += "Tests" }
          if ("${{ needs.imports.result }}" -ne "success") { $bad += "Imports" }
          if ($bad.Count -gt 0) {
            Write-Host "  FAILED: $($bad -join ', ')"
            exit 1
          }
          Write-Host "  STATUS: ALL PASSED"
