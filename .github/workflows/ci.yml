name: JARVIS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # -------------------------------------------------------
  # JOB 1 - Syntax Check
  # -------------------------------------------------------
  syntax:
    name: Syntax Check
    runs-on: windows-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check - core modules
        shell: pwsh
        run: |
          $ok = $true
          $list = @(
            "jarvis/__init__.py",
            "jarvis/audio/vad.py",
            "jarvis/audio/fullduplex.py",
            "jarvis/audio/sound_effects.py",
            "jarvis/tts/piper.py",
            "jarvis/stt/faster_whisper.py",
            "jarvis/memory/vector_store.py",
            "jarvis/workers/night_shift.py",
            "jarvis/workers/auto_updater.py",
            "jarvis/workers/notification_hub.py"
          )
          foreach ($f in $list) {
            $err = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $f -> $err"
              $ok = $false
            } else {
              Write-Host "OK: $f"
            }
          }
          if (-not $ok) { exit 1 }

      - name: Check - communications
        shell: pwsh
        run: |
          $ok = $true
          $list = @(
            "jarvis/comms/discord.py",
            "jarvis/comms/mobile_bridge.py",
            "jarvis/comms/zalo.py",
            "jarvis/comms/telegram.py"
          )
          foreach ($f in $list) {
            $err = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $f -> $err"
              $ok = $false
            } else {
              Write-Host "OK: $f"
            }
          }
          if (-not $ok) { exit 1 }

      - name: Check - new modules v3.1 v4.0
        shell: pwsh
        run: |
          $ok = $true
          $list = @(
            "jarvis/browser/cdp_controller.py",
            "jarvis/plugins/loader.py",
            "jarvis/agent/graph.py",
            "jarvis/agent/__init__.py"
          )
          foreach ($f in $list) {
            $err = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $f -> $err"
              $ok = $false
            } else {
              Write-Host "OK: $f"
            }
          }
          if (-not $ok) { exit 1 }

      - name: Check - skills
        shell: pwsh
        run: |
          $ok = $true
          $list = @(
            "jarvis/skills/screen_context/__init__.py",
            "jarvis/skills/macro_recorder/__init__.py",
            "jarvis/skills/skill_synthesizer/__init__.py",
            "jarvis/skills/rag_search/__init__.py",
            "jarvis/skills/night_planner/__init__.py",
            "jarvis/skills/smart_home_discovery/__init__.py",
            "jarvis/skills/sound_board/__init__.py",
            "jarvis/skills/browser_control/__init__.py",
            "jarvis/skills/auto_updater/__init__.py"
          )
          foreach ($f in $list) {
            $err = python -m py_compile $f 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "FAIL: $f -> $err"
              $ok = $false
            } else {
              Write-Host "OK: $f"
            }
          }
          if (-not $ok) { exit 1 }

  # -------------------------------------------------------
  # JOB 2 - Unit Tests
  # -------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 25
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install required packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip --quiet
          pip install `
            "google-generativeai>=0.7" `
            "python-dotenv" `
            "numpy" `
            "Pillow" `
            "requests" `
            "psutil" `
            "pyperclip" `
            "elevenlabs" `
            "pytest>=8" `
            "pytest-subtests" `
            "pytest-timeout" `
            --quiet
          Write-Host "Required packages installed"

      - name: Install optional Windows packages
        shell: pwsh
        run: pip install pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Install optional audio packages
        shell: pwsh
        run: pip install sounddevice --quiet
        continue-on-error: true

      - name: Install optional communication packages
        shell: pwsh
        run: pip install python-telegram-bot --quiet
        continue-on-error: true

      - name: Create directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          New-Item -ItemType Directory -Force -Path logs    | Out-Null

      - name: Check test collection
        shell: pwsh
        run: |
          python -m pytest tests/unit/ --collect-only -q 2>&1 | Select-Object -Last 5
        env:
          PYTHONIOENCODING: utf-8
          JARVIS_HEADLESS: "1"
          JARVIS_MOCK_AUDIO: "1"
          GOOGLE_API_KEY: "test_dummy_ci_key"

      - name: Run 633 tests
        shell: pwsh
        run: |
          python -m pytest tests/unit/ `
            -v `
            --tb=long `
            --timeout=120 `
            --junit-xml=reports/junit.xml `
            2>&1 | Tee-Object reports/test_output.txt
        env:
          PYTHONIOENCODING: utf-8
          JARVIS_HEADLESS: "1"
          JARVIS_MOCK_AUDIO: "1"
          GOOGLE_API_KEY: "test_dummy_ci_key"

      - name: Show test summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path reports/junit.xml) {
            [xml]$j = Get-Content reports/junit.xml
            $s = $j.testsuites.testsuite
            Write-Host "Tests=$($s.tests) Failures=$($s.failures) Errors=$($s.errors) Time=$($s.time)s"
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
          retention-days: 14

  # -------------------------------------------------------
  # JOB 3 - Import Validation
  # -------------------------------------------------------
  imports:
    name: Import Validation
    runs-on: windows-latest
    timeout-minutes: 8
    needs: syntax

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip --quiet
          pip install google-generativeai python-dotenv numpy Pillow requests psutil pyperclip pywin32 pystray keyboard --quiet
        continue-on-error: true

      - name: Validate module imports
        shell: pwsh
        run: |
          $script = @"
          import sys, importlib
          MODULES = [
              'jarvis.memory.vector_store',
              'jarvis.workers.auto_updater',
              'jarvis.workers.notification_hub',
              'jarvis.workers.night_shift',
              'jarvis.browser.cdp_controller',
              'jarvis.plugins.loader',
              'jarvis.agent.graph',
              'jarvis.comms.zalo',
              'jarvis.skills.skill_synthesizer',
              'jarvis.skills.rag_search',
              'jarvis.skills.browser_control',
              'jarvis.skills.auto_updater',
          ]
          OPTIONAL_DEPS = {'playwright','webrtcvad','onnxruntime','faster_whisper',
                           'piper','winotify','sounddevice','discord','telegram'}
          failed = []
          for mod in MODULES:
              try:
                  importlib.import_module(mod)
                  print(f'OK   {mod}')
              except ImportError as e:
                  if any(o in str(e) for o in OPTIONAL_DEPS):
                      print(f'--   {mod}  (optional dep missing)')
                  else:
                      print(f'ERR  {mod}: {e}')
                      failed.append(mod)
              except Exception as e:
                  print(f'ERR  {mod}: {e}')
                  failed.append(mod)
          if failed:
              print(f'FAILED: {failed}')
              sys.exit(1)
          print('All imports OK')
          "@
          python -c $script
        env:
          PYTHONIOENCODING: utf-8

  # -------------------------------------------------------
  # JOB 4 - Summary
  # -------------------------------------------------------
  summary:
    name: Pipeline Summary
    runs-on: windows-latest
    timeout-minutes: 3
    needs: [syntax, test, imports]
    if: always()

    steps:
      - name: Print results
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "JARVIS CI Results"
          Write-Host "========================================"
          Write-Host "Syntax Check:    ${{ needs.syntax.result }}"
          Write-Host "Unit Tests:      ${{ needs.test.result }}"
          Write-Host "Import Check:    ${{ needs.imports.result }}"
          Write-Host "========================================"
          $failed = @()
          if ("${{ needs.syntax.result }}" -ne "success") { $failed += "Syntax" }
          if ("${{ needs.test.result }}"   -ne "success") { $failed += "Tests" }
          if ("${{ needs.imports.result }}" -ne "success") { $failed += "Imports" }
          if ($failed.Count -gt 0) {
            Write-Host "STATUS: FAILED ($($failed -join ', '))"
            exit 1
          }
          Write-Host "STATUS: ALL PASSED"
