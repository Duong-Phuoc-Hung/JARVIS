name: JARVIS CI — Tests, Lint & Health Report

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Cancel previous runs when new commits push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  JARVIS_HEADLESS: "1"
  JARVIS_MOCK_AUDIO: "1"

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Syntax & Lint (chạy trước, nhanh nhất)
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Syntax & Lint Check
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: 🔍 Syntax check — Core
        run: |
          python -m py_compile jarvis/__init__.py
          python -m py_compile jarvis/audio/vad.py
          python -m py_compile jarvis/audio/fullduplex.py
          python -m py_compile jarvis/audio/sound_effects.py
          python -m py_compile jarvis/tts/piper.py
          python -m py_compile jarvis/stt/faster_whisper.py
          python -m py_compile jarvis/memory/vector_store.py
          python -m py_compile jarvis/workers/night_shift.py
          python -m py_compile jarvis/workers/auto_updater.py
          python -m py_compile jarvis/workers/notification_hub.py
          echo "Core syntax OK"

      - name: 🔍 Syntax check — Communications
        run: |
          python -m py_compile jarvis/comms/discord.py
          python -m py_compile jarvis/comms/mobile_bridge.py
          python -m py_compile jarvis/comms/zalo.py
          python -m py_compile jarvis/comms/telegram.py
          echo "Comms syntax OK"

      - name: 🔍 Syntax check — New Modules (v3.1-v4.0)
        run: |
          python -m py_compile jarvis/browser/cdp_controller.py
          python -m py_compile jarvis/plugins/loader.py
          python -m py_compile jarvis/agent/graph.py
          python -m py_compile jarvis/smart_home/discovery.py
          echo "New modules syntax OK"

      - name: 🔍 Syntax check — Skills
        run: |
          python -m py_compile jarvis/skills/screen_context/__init__.py
          python -m py_compile jarvis/skills/macro_recorder/__init__.py
          python -m py_compile jarvis/skills/skill_synthesizer/__init__.py
          python -m py_compile jarvis/skills/rag_search/__init__.py
          python -m py_compile jarvis/skills/night_planner/__init__.py
          python -m py_compile jarvis/skills/smart_home_discovery/__init__.py
          python -m py_compile jarvis/skills/sound_board/__init__.py
          python -m py_compile jarvis/skills/browser_control/__init__.py
          python -m py_compile jarvis/skills/auto_updater/__init__.py
          echo "Skills syntax OK"

      - name: 🔍 Syntax check — Build Scripts
        run: |
          python -m py_compile scripts/build_installer.py
          python -m py_compile scripts/health_check_report.py
          echo "Scripts syntax OK"

      - name: ✅ Lint Summary
        run: echo "All syntax checks passed!"

  # ──────────────────────────────────────────────
  # JOB 2: Full Test Suite (phụ thuộc lint)
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests (633 tests)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run full test suite with JUnit report
        run: |
          python -m pytest tests/unit/ `
            --tb=short `
            --no-header `
            -q `
            --junit-xml=reports/junit_results.xml `
            -v `
            2>&1 | Tee-Object -FilePath reports/test_output.txt
        env:
          PYTHONIOENCODING: utf-8

      - name: 📊 Print test summary
        if: always()
        run: |
          $lines = Get-Content reports/test_output.txt -Tail 10
          Write-Host "=== TEST SUMMARY ==="
          $lines | ForEach-Object { Write-Host $_ }

      - name: 🩺 Generate health report
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $env:PYTHONIOENCODING = "utf-8"
          python scripts/health_check_report.py 2>&1 | Out-Host
        continue-on-error: true

      - name: 📋 Count modules
        run: |
          $skills = (Get-ChildItem jarvis/skills -Directory).Count
          $tests  = (Get-ChildItem tests/unit -Filter "test_*.py").Count
          Write-Host "Skills: $skills | Test files: $tests"

      - name: 📤 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-test-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 14

  # ──────────────────────────────────────────────
  # JOB 3: Module Import Check
  # ──────────────────────────────────────────────
  import-check:
    name: 📦 Module Import Validation
    runs-on: windows-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔌 Validate all module imports
        run: |
          python -c "
          import sys, importlib, traceback
          modules = [
              'jarvis.audio.vad',
              'jarvis.audio.sound_effects',
              'jarvis.memory.vector_store',
              'jarvis.workers.night_shift',
              'jarvis.workers.auto_updater',
              'jarvis.workers.notification_hub',
              'jarvis.browser.cdp_controller',
              'jarvis.plugins.loader',
              'jarvis.agent.graph',
              'jarvis.comms.zalo',
              'jarvis.comms.discord',
              'jarvis.comms.mobile_bridge',
              'jarvis.skills.skill_synthesizer',
              'jarvis.skills.rag_search',
              'jarvis.skills.browser_control',
              'jarvis.skills.auto_updater',
          ]
          failed = []
          for mod in modules:
              try:
                  importlib.import_module(mod)
                  print(f'  OK  {mod}')
              except ImportError as e:
                  # Expected for optional deps (playwright, webrtcvad...)
                  if 'playwright' in str(e) or 'webrtcvad' in str(e) or 'onnxruntime' in str(e):
                      print(f'  --  {mod} (optional dep missing: {e})')
                  else:
                      print(f'  FAIL {mod}: {e}')
                      failed.append(mod)
              except Exception as e:
                  print(f'  ERR  {mod}: {e}')
                  failed.append(mod)
          if failed:
              print(f'FAILED: {failed}')
              sys.exit(1)
          print('All core imports OK')
          "
        env:
          PYTHONIOENCODING: utf-8

  # ──────────────────────────────────────────────
  # JOB 4: Summary Badge (chạy sau tất cả)
  # ──────────────────────────────────────────────
  summary:
    name: 📊 CI Summary
    runs-on: windows-latest
    timeout-minutes: 5
    needs: [lint, test, import-check]
    if: always()

    steps:
      - name: 📊 Print final status
        run: |
          Write-Host "=================================================="
          Write-Host " JARVIS CI PIPELINE RESULT"
          Write-Host "=================================================="
          Write-Host " Lint:          ${{ needs.lint.result }}"
          Write-Host " Tests:         ${{ needs.test.result }}"
          Write-Host " Import Check:  ${{ needs.import-check.result }}"
          Write-Host "=================================================="
          $results = @("${{ needs.lint.result }}", "${{ needs.test.result }}", "${{ needs.import-check.result }}")
          if ($results -contains "failure") {
            Write-Host " STATUS: FAILED - check logs above"
            exit 1
          } else {
            Write-Host " STATUS: ALL PASSED"
          }
