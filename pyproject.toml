[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jarvis-assistant"
version = "4.0.0"
description = "Autonomous AI Personal Assistant for Windows — Voice, Multi-channel, Self-evolving"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Duong Phuoc Hung", email = "duongphuochung@example.com" }]
keywords = ["ai", "assistant", "voice", "automation", "windows", "jarvis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.10"
dependencies = [
    "google-generativeai>=0.8,<2",
    "python-dotenv>=1.0,<2",
    "numpy>=1.24,<3",
    "Pillow>=10,<12",
    "requests>=2.31,<3",
    "psutil>=5.9,<7",
    "pyperclip>=1.8,<2",
    "pystray>=0.19,<1",
    "keyboard>=0.13,<1",
    "python-telegram-bot>=21,<23",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6,<0.6",
]
windows = [
    "pywin32>=306",
]
offline = [
    "faster-whisper>=1.0",
    "scikit-learn>=1.3,<2",
]
browser = [
    "playwright>=1.40",
]
notifications = [
    "winotify>=1.1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-subtests>=0.12",
    "pytest-timeout>=2.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
all = [
    "jarvis-assistant[audio,windows,offline,browser,notifications,dev]",
]

[project.urls]
Homepage = "https://github.com/Duong-Phuoc-Hung/JARVIS"
Repository = "https://github.com/Duong-Phuoc-Hung/JARVIS"
Issues = "https://github.com/Duong-Phuoc-Hung/JARVIS/issues"
Changelog = "https://github.com/Duong-Phuoc-Hung/JARVIS/blob/main/CHANGELOG.md"

[project.scripts]
jarvis = "jarvis.__main__:main"

[project.gui-scripts]
jarvis-tray = "jarvis.__main__:main_tray"

# ── Tool Configuration ────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--no-header",
    "-q",
    "--timeout=60",
]
filterwarnings = [
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks integration tests",
    "requires_audio: marks tests requiring audio hardware",
]

[tool.coverage.run]
source = ["jarvis"]
omit = [
    "jarvis/__main__.py",
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["jarvis", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # within except clause, raise from
    "B007",   # loop control variable not used in loop body
    "B905",   # zip() without strict parameter
    "F401",   # imported but unused (common in __init__.py)
    "F811",   # redefinition of unused variable
    "F821",   # undefined name (false positives with TYPE_CHECKING)
    "F841",   # local variable assigned but never used
    "W293",   # blank line contains whitespace
    "E741",   # ambiguous variable name (l, O, I)
    "E721",   # type comparison (use isinstance)
    "UP",     # pyupgrade — handled separately
]

[tool.ruff.lint.isort]
known-first-party = ["jarvis"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "pystray",
    "keyboard",
    "win32api",
    "win32con",
    "winotify",
    "playwright.*",
    "faster_whisper",
    "telegram.*",
]
ignore_missing_imports = true
